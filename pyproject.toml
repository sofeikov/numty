[project]
name = "numty"
version = "0.1.0"
description = "Static shape checking for NumPy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ty==0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Real package layout (issue #31): mypy honors `numty/py.typed` inside a
# package, but not a top-level `py.typed` next to single-file modules —
# wheel installs used to report `Skipping analyzing "numty"`.
packages = ["numty"]
[tool.hatch.build.targets.wheel.force-include]
"numty_plugin.py" = "numty_plugin.py"
"numty_convert.py" = "numty_convert.py"
"numty_codmod.py" = "numty_codmod.py"

[tool.pytest.ini_options]
# Parallel by default: mypy/python subprocesses dominate runtime and the
# suite is fully parallel-safe (per-worker mypy caches + tmp_path isolation).
# -n 4 beats -n auto here: 20 workers each redo the session mypy batch.
addopts = "-n 4"
