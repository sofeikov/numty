[project]
name = "numty"
version = "0.1.0"
description = "Static shape checking for NumPy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ty==0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Regular package layout (issues #31, #147): mypy only honors `py.typed`
# inside a package directory — not a top-level marker next to single-file
# modules, and not a co-located `.pyi` (an installed top-level `.py` is
# never a candidate without its own package dir). So the plugin and the
# two tools are real packages (`numty_plugin/`, `numty_convert/`,
# `numty_codmod/`), each with its own `py.typed`, keeping the same
# top-level import names (`plugins = numty_plugin` is unchanged). As a
# side effect the editable install is a single `.pth` to the checkout, so
# `numty` and the tools all import live from one place.
packages = ["numty", "numty_plugin", "numty_convert", "numty_codmod"]

[tool.pytest.ini_options]
# Parallel by default: mypy/python subprocesses dominate runtime and the
# suite is fully parallel-safe (per-worker mypy caches + tmp_path isolation).
# -n 4 beats -n auto here: 20 workers each redo the session mypy batch.
addopts = "-n 4"
