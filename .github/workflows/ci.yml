name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # Pyflakes rules through ruff (config in pyproject.toml). The split
    # of numty_plugin (#192) added 967 findings because no check ran.
    name: lint (ruff, ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run ruff
        run: uv run ruff check .
      - name: Type-check with ty (excludes in pyproject.toml)
        # The plugin had 95 ty errors and no check. Three of them were
        # real defects (a method that does not exist on UnionType, a
        # wrong attribute on TupleType, a string compared as an object).
        run: uv run ty check

  test:
    # Issue #164 step 2: hooks key on private numpy module paths, so the
    # oldest supported numpy (2.5, the `numpy>=2.5` floor) and the latest
    # release both run the suite. A stub rename that silently unhooks
    # everything must fail here, not in production.
    strategy:
      matrix:
        numpy: ["minimum", "latest"]
    name: test (numpy ${{ matrix.numpy }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests (including sklearn dogfood)
        # scikit-learn stays an optional local dep (tests importorskip
        # without it), but CI must exercise the sklearn fixtures so a
        # red dogfood file fails the suite (issue #163).
        run: |
          if [ "${{ matrix.numpy }}" = "minimum" ]; then
            uv run --with 'numpy==2.5.*' --with scikit-learn pytest
          else
            uv run --with scikit-learn pytest
          fi
